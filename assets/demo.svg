<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c12"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="-0.05" r="0.9">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#halo)"/>

  <!-- ============ HEADER ============ -->
  <rect x="16" y="16" width="968" height="52" rx="12" fill="#0e1219" stroke="#1c2230"/>
  <g>
    <circle cx="46" cy="42" r="15" fill="none" stroke="#4f8cff" stroke-opacity="0.25"/>
    <circle cx="46" cy="42" r="8" fill="none" stroke="#4f8cff" stroke-opacity="0.4"/>
    <line x1="46" y1="42" x2="46" y2="27" stroke="#9bbcff" stroke-width="1.4">
      <animateTransform attributeName="transform" type="rotate" from="0 46 42" to="360 46 42" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
  <text x="74" y="38" fill="#e6e9ef" font-size="16" font-weight="700">Claude Mission Control</text>
  <text x="74" y="55" fill="#8b94a7" font-size="11">Live-Observability für Claude Code</text>
  <text x="812" y="46" fill="#8b94a7" font-size="12">128 Events</text>
  <circle cx="912" cy="42" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="924" y="46" fill="#8b94a7" font-size="12">verbunden</text>

  <!-- ============ KANBAN ============ -->
  <rect x="16" y="80" width="612" height="250" rx="12" fill="#0e1219" stroke="#1c2230"/>
  <text x="32" y="106" fill="#e6e9ef" font-size="13" font-weight="700">Sessions</text>
  <line x1="16" y1="118" x2="628" y2="118" stroke="#1c2230"/>

  <!-- columns -->
  <g font-size="11">
    <!-- Aktiv -->
    <circle cx="34" cy="136" r="4" fill="#34d399"/>
    <text x="44" y="140" fill="#34d399" font-weight="700">Aktiv</text>
    <text x="200" y="140" fill="#8b94a7" text-anchor="end">2</text>
    <!-- Wartet -->
    <circle cx="234" cy="136" r="4" fill="#fbbf24"/>
    <text x="244" y="140" fill="#fbbf24" font-weight="700">Wartet</text>
    <text x="404" y="140" fill="#8b94a7" text-anchor="end">2</text>
    <!-- Beendet -->
    <circle cx="438" cy="136" r="4" fill="#71717a"/>
    <text x="448" y="140" fill="#a1a1aa" font-weight="700">Beendet</text>
    <text x="612" y="140" fill="#8b94a7" text-anchor="end">1</text>
  </g>

  <!-- Aktiv cards -->
  <g>
    <rect x="28" y="152" width="176" height="52" rx="8" fill="#0a0d13" stroke="#4f8cff">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="38" y="172" fill="#e6e9ef" font-size="11">Baue das Dashboard…</text>
    <text x="38" y="194" fill="#8b94a7" font-size="9">My_Dash · 11 · 4</text>
  </g>
  <g>
    <rect x="28" y="212" width="176" height="52" rx="8" fill="#0a0d13" stroke="#1c2230"/>
    <text x="38" y="232" fill="#e6e9ef" font-size="11">Refactor orders.ts</text>
    <text x="38" y="254" fill="#8b94a7" font-size="9">shopify-bot · 7 · 3</text>
  </g>

  <!-- Wartet cards -->
  <g>
    <rect x="232" y="152" width="176" height="52" rx="8" fill="#0a0d13" stroke="#1c2230"/>
    <text x="242" y="172" fill="#e6e9ef" font-size="11">Analysiere Bestellungen</text>
    <text x="242" y="194" fill="#8b94a7" font-size="9">shopify-bot · 10 · 3</text>
  </g>
  <g opacity="0">
    <rect x="232" y="212" width="176" height="52" rx="8" fill="#0a0d13" stroke="#1c2230"/>
    <text x="242" y="232" fill="#e6e9ef" font-size="11">Schreibe Tests</text>
    <text x="242" y="254" fill="#8b94a7" font-size="9">api-server · 5 · 2</text>
    <animate attributeName="opacity" values="0;0;1;1" dur="6s" keyTimes="0;0.4;0.5;1" repeatCount="indefinite"/>
  </g>

  <!-- Beendet card -->
  <g>
    <rect x="436" y="152" width="176" height="52" rx="8" fill="#0a0d13" stroke="#1c2230"/>
    <text x="446" y="172" fill="#a1a1aa" font-size="11">Setup CI Pipeline</text>
    <text x="446" y="194" fill="#8b94a7" font-size="9">infra · 18 · 9</text>
  </g>

  <!-- ============ LIVE STREAM ============ -->
  <rect x="640" y="80" width="344" height="250" rx="12" fill="#0e1219" stroke="#1c2230"/>
  <text x="656" y="106" fill="#e6e9ef" font-size="13" font-weight="700">Live Stream</text>
  <circle cx="952" cy="101" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="964" y="105" fill="#8b94a7" font-size="10" text-anchor="end">live</text>
  <line x1="640" y1="118" x2="984" y2="118" stroke="#1c2230"/>

  <!-- moving highlight -->
  <rect x="648" y="126" width="328" height="34" rx="6" fill="#4f8cff" fill-opacity="0.08">
    <animate attributeName="y" values="126;164;202;240;278;126" dur="3s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <!-- rows -->
  <g font-size="11">
    <g transform="translate(0,0)">
      <circle cx="664" cy="143" r="4" fill="#fbbf24"/>
      <text x="678" y="140" fill="#e6e9ef">Edit: src/app/page.tsx</text>
      <text x="970" y="140" fill="#8b94a7" font-size="9" text-anchor="end">vor 2s</text>
      <text x="678" y="153" fill="#8b94a7" font-size="9">PreToolUse · 7j64cu7p</text>
    </g>
    <g>
      <circle cx="664" cy="181" r="4" fill="#34d399"/>
      <text x="678" y="178" fill="#e6e9ef">Bash ✓ npm run build</text>
      <text x="970" y="178" fill="#8b94a7" font-size="9" text-anchor="end">vor 5s</text>
      <text x="678" y="191" fill="#8b94a7" font-size="9">PostToolUse · 7j64cu7p</text>
    </g>
    <g>
      <circle cx="664" cy="219" r="4" fill="#38bdf8"/>
      <text x="678" y="216" fill="#e6e9ef">Prompt: Verkabele die Hooks</text>
      <text x="970" y="216" fill="#8b94a7" font-size="9" text-anchor="end">vor 9s</text>
      <text x="678" y="229" fill="#8b94a7" font-size="9">UserPromptSubmit · 7j64cu7p</text>
    </g>
    <g>
      <circle cx="664" cy="257" r="4" fill="#a78bfa"/>
      <text x="678" y="254" fill="#e6e9ef">Subagent fertig</text>
      <text x="970" y="254" fill="#8b94a7" font-size="9" text-anchor="end">vor 14s</text>
      <text x="678" y="267" fill="#8b94a7" font-size="9">SubagentStop · 1mp2gx0h</text>
    </g>
    <g>
      <circle cx="664" cy="295" r="4" fill="#34d399"/>
      <text x="678" y="292" fill="#e6e9ef">Session gestartet</text>
      <text x="970" y="292" fill="#8b94a7" font-size="9" text-anchor="end">vor 21s</text>
      <text x="678" y="305" fill="#8b94a7" font-size="9">SessionStart · 1mp2gx0h</text>
    </g>
  </g>

  <!-- ============ TOKEN CHART ============ -->
  <rect x="16" y="342" width="468" height="242" rx="12" fill="#0e1219" stroke="#1c2230"/>
  <text x="32" y="368" fill="#e6e9ef" font-size="13" font-weight="700">Tokens &amp; Kosten</text>
  <text x="468" y="368" fill="#8b94a7" font-size="11" text-anchor="end">€6.73 · 7.8M tok</text>
  <line x1="16" y1="380" x2="484" y2="380" stroke="#1c2230"/>

  <!-- gridlines -->
  <g stroke="#1c2230">
    <line x1="48" y1="410" x2="466" y2="410"/>
    <line x1="48" y1="460" x2="466" y2="460"/>
    <line x1="48" y1="510" x2="466" y2="510"/>
  </g>
  <!-- area + line (draws in) -->
  <path d="M48 540 L48 500 L100 480 L152 495 L204 450 L256 462 L308 420 L360 435 L412 405 L466 415 L466 540 Z"
        fill="url(#area)" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" keyTimes="0;0.45;0.9;1" repeatCount="indefinite"/>
  </path>
  <path d="M48 500 L100 480 L152 495 L204 450 L256 462 L308 420 L360 435 L412 405 L466 415"
        fill="none" stroke="#4f8cff" stroke-width="2.5" pathLength="100"
        stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;0;100" dur="6s" keyTimes="0;0.45;0.9;1" repeatCount="indefinite"/>
  </path>
  <g font-size="9" fill="#8b94a7">
    <text x="44" y="556" text-anchor="end">0</text>
    <text x="118" y="572">05-18</text>
    <text x="300" y="572">05-20</text>
    <text x="448" y="572">05-22</text>
  </g>

  <!-- ============ TOOL GRAPH ============ -->
  <rect x="496" y="342" width="488" height="242" rx="12" fill="#0e1219" stroke="#1c2230"/>
  <text x="512" y="368" fill="#e6e9ef" font-size="13" font-weight="700">Tool-Graph (3D)</text>
  <g font-size="9" transform="translate(0,0)">
    <circle cx="820" cy="364" r="4" fill="#4f8cff"/><text x="828" y="367" fill="#8b94a7">Session</text>
    <circle cx="884" cy="364" r="4" fill="#fbbf24"/><text x="892" y="367" fill="#8b94a7">Tool</text>
    <circle cx="936" cy="364" r="4" fill="#34d399"/><text x="944" y="367" fill="#8b94a7">Datei</text>
  </g>
  <line x1="496" y1="380" x2="984" y2="380" stroke="#1c2230"/>

  <!-- links -->
  <g stroke="#2a3344" stroke-width="1.2" fill="none">
    <path id="l1" d="M600 470 L690 430"/>
    <path id="l2" d="M600 470 L660 520"/>
    <path id="l3" d="M800 450 L690 430"/>
    <path id="l4" d="M800 450 L870 500"/>
    <path d="M690 430 L710 392"/>
    <path d="M660 520 L620 545"/>
    <path d="M870 500 L915 540"/>
  </g>

  <!-- particles -->
  <circle r="2.6" fill="#9bbcff">
    <animateMotion dur="2s" repeatCount="indefinite" path="M600 470 L690 430"/>
  </circle>
  <circle r="2.6" fill="#9bbcff">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M800 450 L870 500"/>
  </circle>
  <circle r="2.6" fill="#9bbcff">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M800 450 L690 430"/>
  </circle>

  <!-- file nodes -->
  <g fill="#34d399">
    <circle cx="710" cy="392" r="5"/>
    <circle cx="620" cy="545" r="5"/>
    <circle cx="915" cy="540" r="5"/>
  </g>
  <!-- tool nodes -->
  <g>
    <circle cx="690" cy="430" r="8" fill="#fbbf24">
      <animate attributeName="r" values="8;9.5;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="520" r="8" fill="#fbbf24">
      <animate attributeName="r" values="8;9.5;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="500" r="8" fill="#fbbf24">
      <animate attributeName="r" values="8;9.5;8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-size="9" fill="#cbd5e1">
    <text x="690" y="416" text-anchor="middle">Edit</text>
    <text x="660" y="540" text-anchor="middle">Bash</text>
    <text x="884" y="492" text-anchor="middle">Read</text>
  </g>
  <!-- session nodes -->
  <g>
    <circle cx="600" cy="470" r="12" fill="#4f8cff">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="450" r="12" fill="#4f8cff">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer -->
  <text x="500" y="596" fill="#3f4656" font-size="10" text-anchor="middle">read-only · Hooks → SQLite → UI · die KI rendert dieses Dashboard nie</text>
</svg>
