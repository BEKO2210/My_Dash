name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it occur?
      options:
        - Desktop app
        - Local dev (from source)
        - Public demo (GitHub Pages)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. v1.0.0-beta
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other / N/A
  - type: textarea
    id: logs
    attributes:
      label: Console output / screenshots
      description: Any errors from the browser console or terminal, plus screenshots.
      render: shell
