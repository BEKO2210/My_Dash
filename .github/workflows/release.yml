name: Build desktop installers

# Builds unsigned beta installers for Windows, macOS and Linux and attaches them
# to the GitHub Release for the pushed tag (marked as a pre-release). Trigger by
# pushing a tag like v1.0.0-beta, or run manually (workflow_dispatch) to produce
# downloadable artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds the Next standalone server, copies static assets, and rebuilds
      # better-sqlite3 against Electron's ABI, then packages the host-OS installer.
      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Beta: mark every tagged release as a pre-release and auto-generate notes.
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
