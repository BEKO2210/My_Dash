name: Deploy demo to GitHub Pages

# Builds the static, client-only demo (src/lib/demo.ts feeds the widgets in the
# browser) and publishes it to GitHub Pages.
# One-time setup: repo → Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The demo is fully static; remove the server API so `output: export` works.
      - name: Strip server API for static export
        run: rm -rf src/app/api

      - name: Build static demo
        run: npm run build
        env:
          MC_DEMO: "1"
          NEXT_PUBLIC_MC_DEMO: "1"
          # Project Pages live under /<repo>; change if you use a custom domain.
          MC_BASE_PATH: "/My_Dash"

      - name: Disable Jekyll (serve _next/*)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
