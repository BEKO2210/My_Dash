name: CI

# The green gate every change must pass before merge: audit · lint · test ·
# build · bundle-budget · docs-sync · e2e. One job, one build (the build is reused
# by the bundle-budget check and the e2e server), failing fast on the first error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes to the same branch/PR cancel in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail on known high/critical vulnerabilities in production deps. Lower-severity
      # advisories are handled by Dependabot (.github/dependabot.yml) so a fix-less
      # low-sev advisory can't block every PR.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Single production build, reused by the bundle-budget check and the e2e
      # server below — one build per PR (better-sqlite3 builds during npm ci; the
      # DB layer uses an in-memory database during `next build`, so no data dir).
      - name: Build
        run: npm run build

      # A stray heavy import can't silently bloat the client bundle.
      - name: Bundle budget
        run: npm run bundle:budget

      # The generated plugin docs must match the registry (run docs:plugins locally
      # and commit if this fails).
      - name: Plugin docs in sync
        run: |
          npm run docs:plugins
          git diff --exit-code -- docs/PLUGINS.md

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Boots `npm run start`, seeds via the ingest API and asserts the dashboard
      # renders, connects and populates. Also runs the axe-core a11y audit and the
      # per-widget visual/empty-state specs.
      - name: E2E (smoke + a11y + widget audits)
        run: npm run test:e2e

      # All audit/visual screenshots in one artifact (collapsed from ~30 per-widget
      # uploads); empty if a run produced none.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
