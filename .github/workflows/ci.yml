name: CI

# Lint, test and build on every pull request and on pushes to main.
# This is the green gate every change must pass before it can be merged —
# the safety net the rest of the roadmap builds on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes to the same branch/PR cancel in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Full production build (better-sqlite3 builds during npm ci; the DB layer
      # uses an in-memory database during `next build`, so no data dir is needed).
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Playwright boots `npm run start` (see playwright.config.ts), seeds via the
      # ingest API and asserts the dashboard renders, connects and populates. Also
      # runs the axe-core accessibility audit (e2e/a11y.spec.ts) and the Phase Z
      # layout (e2e/layout.spec.ts), tool-graph (e2e/tool-graph.spec.ts),
      # budget-gauge (e2e/budget-gauge.spec.ts), heatmap (e2e/heatmap.spec.ts),
      # tool-frequency (e2e/tool-frequency.spec.ts), file-hotspots
      # (e2e/file-hotspots.spec.ts) and session-timeline
      # (e2e/session-timeline.spec.ts) audits as CI gates.
      - name: Smoke + a11y + Phase Z widget E2E
        run: npm run test:e2e

      # Always collect the layout-audit screenshots (Phase Z) for visual review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: test-results/layout-shots
          if-no-files-found: ignore

      # Always collect the tool-graph audit screenshots (Phase Z, Run 107).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-graph-screenshots
          path: test-results/tool-graph-shots
          if-no-files-found: ignore

      # Always collect the budget-gauge audit screenshots (Phase Z, Run 108).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-gauge-screenshots
          path: test-results/budget-gauge-shots
          if-no-files-found: ignore

      # Always collect the heatmap audit screenshots (Phase Z, Run 109).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heatmap-screenshots
          path: test-results/heatmap-shots
          if-no-files-found: ignore

      # Always collect the tool-frequency audit screenshots (Phase Z, Run 110).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-frequency-screenshots
          path: test-results/tool-frequency-shots
          if-no-files-found: ignore

      # Always collect the file-hotspots audit screenshots (Phase Z, Run 111).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-hotspots-screenshots
          path: test-results/file-hotspots-shots
          if-no-files-found: ignore

      # Always collect the session-timeline audit screenshots (Phase Z, Run 112).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-timeline-screenshots
          path: test-results/session-timeline-shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
